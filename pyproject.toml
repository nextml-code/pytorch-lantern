[project]
name = "pytorch-lantern"
version = "0.0.0"
description = "Pytorch project template and related tools"
authors = [{ name = "NextML AB" }]
requires-python = ">=3.8,<4"
readme = "README.rst"
license = "Apache-2.0"
keywords = [
    "pytorch",
    "machine",
    "learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Other Environment",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.19.4,<3",
    "torch>=1.6.0",
    "tqdm",
    "pydantic==2.*",
    "pandas>=1.0.0,<3",
    "pydantic-core>=2.14.5,<3",
]

[project.optional-dependencies]
training = ["tensorboard>=2.2.0,<3"]

[project.urls]
Repository = "https://github.com/nextml-code/pytorch-lantern"
Documentation = "https://pytorch-lantern.readthedocs.io"

[dependency-groups]
test = [
    "pytest>=6.1.2,<7",
    "rstcheck>=3.3.1,<4",
    "Sphinx>=3.3.0,<4",
    "black>=23.11.0,<24",
]
dev = [
    "cookiecutter>=1.7.2,<2",
    "flake8>=3.8.4,<4",
    "torchvision==0.*",
    "pytorch-datastream>=0.4.9,<0.5",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-root = ""
module-name = "lantern"

[build-system]
requires = ["uv_build>=0.11.25,<0.12"]
build-backend = "uv_build"

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
exclude = '''

(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
)
'''
